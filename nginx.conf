server {
    listen 3000;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # ─── Gzip Compression ───────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types
        text/plain
        text/css
        text/javascript
        text/xml
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        application/vnd.ms-fontobject
        application/x-font-ttf
        font/opentype
        image/svg+xml
        image/x-icon;

    # ─── Security Headers ──────────────────────────────────────
    # Prevent clickjacking
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Prevent MIME-type sniffing
    add_header X-Content-Type-Options "nosniff" always;

    # XSS protection (legacy browsers)
    add_header X-XSS-Protection "1; mode=block" always;

    # Control referrer information
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Permissions policy — restrict browser features
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=()" always;

    # Content Security Policy — allow self-hosted Supabase via /api/, YouTube, Google Fonts, and Maps
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://*.supabase.co https://*.supabase.in; media-src 'self' blob:; connect-src 'self' https://*.supabase.co https://*.supabase.in wss://*.supabase.co; frame-src https://www.youtube.com https://maps.app.goo.gl https://www.google.com;" always;

    # Strict Transport Security (effective when behind HTTPS proxy/LB)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # ─── Cache: Vite Hashed Assets (immutable) ─────────────────
    # Vite outputs JS/CSS with content hashes in /assets/
    # Block direct browser navigation to JS/CSS files (returns 403)
    # but allow normal loading via <script>/<link> tags
    location /assets/ {
        # Block direct navigation: when Sec-Fetch-Dest is "document"
        # it means someone typed the URL directly in the browser
        if ($http_sec_fetch_dest = "document") {
            return 403;
        }

        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    # ─── Cache: Images & Media ─────────────────────────────────
    location /images/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000" always;
        access_log off;
    }

    # ─── Cache: Fonts ──────────────────────────────────────────
    location ~* \.(woff2?|ttf|otf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    # ─── Cache: Favicon & manifest ─────────────────────────────
    location ~* \.(ico|webmanifest)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800" always;
        access_log off;
    }

    # ─── SPA Fallback ──────────────────────────────────────────
    # index.html must never be cached so users always get the latest build
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
    }

    # ─── Block dot-files (except .well-known for ACME/SSL) ─────
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
    location ~ /\.well-known/ {
        allow all;
    }

    # ─── Disable server version exposure ───────────────────────
    server_tokens off;

    # ─── Error pages ───────────────────────────────────────────
    error_page 404 /index.html;
}
